<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-игры на двоих</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Unbounded', sans-serif;
            background: #020617;
            color: white;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        /* --- 3D DICE STYLES --- */
        .dice-box { perspective: 1000px; width: 100px; height: 100px; }
        .dice {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.3, 1.1);
        }
        .dice-side {
            position: absolute; width: 100px; height: 100px;
            background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
            border: 2px solid #cbd5e1; border-radius: 16px;
            display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }
        .dot { background: #1e293b; border-radius: 50%; width: 16px; height: 16px; align-self: center; justify-self: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }

        .front  { transform: rotateY(0deg) translateZ(50px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .right  { transform: rotateY(90deg) translateZ(50px); }
        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .top    { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }

        /* --- TIC TAC TOE --- */
        .ttt-cell {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* --- MODAL & ANIMATIONS --- */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.9); z-index: 100;
            align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }

        @keyframes molodec-pulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 20px #fbbf24; }
            50% { transform: scale(1.1); text-shadow: 0 0 40px #fbbf24; }
        }
        .winner-text { animation: molodec-pulse 0.8s infinite; color: #fbbf24; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- МЕНЮ -->
    <div id="menu" class="flex flex-col items-center justify-center min-h-screen space-y-8 p-6">
        <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 text-center uppercase">Игровой Портал</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl">
            <button onclick="openGame('ttt')" class="glass p-8 hover:scale-105 transition group">
                <div class="text-4xl mb-4 group-hover:rotate-12 transition">❌⭕</div>
                <div class="font-bold tracking-widest uppercase text-xs">Крестики-Нолики</div>
            </button>
            <button onclick="openGame('click')" class="glass p-8 hover:scale-105 transition group">
                <div class="text-4xl mb-4 group-hover:scale-125 transition">⚡</div>
                <div class="font-bold tracking-widest uppercase text-xs">Гонка Кликов</div>
            </button>
            <button onclick="openGame('dice')" class="glass p-8 hover:scale-105 transition group">
                <div class="text-4xl mb-4 group-hover:rotate-45 transition">🎲</div>
                <div class="font-bold tracking-widest uppercase text-xs">Кости 3.0</div>
            </button>
        </div>
        <button onclick="initAudio()" id="musicBtn" class="text-[10px] opacity-40 hover:opacity-100 transition uppercase tracking-widest">Активировать звуки 🔊</button>
    </div>

    <!-- КОНТЕЙНЕР ИГР -->
    <div id="gameContainer" class="hidden flex flex-col items-center justify-center min-h-screen p-4">
        <button onclick="goHome()" class="absolute top-6 left-6 text-slate-500 font-bold hover:text-white uppercase text-[10px] tracking-widest">← В меню</button>

        <!-- КРЕСТИКИ-НОЛИКИ -->
        <div id="tttView" class="hidden glass p-6 w-full max-w-sm">
            <div class="flex justify-between mb-4 gap-2">
                <button id="tttPvp" onclick="setTTTMode('pvp')" class="flex-1 text-[10px] bg-blue-600 p-2 rounded font-bold uppercase">Вдвоем</button>
                <button id="tttPve" onclick="setTTTMode('pve')" class="flex-1 text-[10px] bg-slate-700 p-2 rounded font-bold uppercase">Робот</button>
            </div>
            <div id="tttStatus" class="text-center mb-4 text-blue-400 text-xs font-bold uppercase">Ход X</div>
            <div class="grid grid-cols-3 gap-2 bg-slate-800 p-2 rounded-xl" id="tttBoard">
                <!-- Генерируем 9 клеток -->
                <script>
                    for(let i=0; i<9; i++) document.write(`<div onclick="handleTTT(${i})" id="ttt${i}" class="bg-slate-900 aspect-square rounded-lg flex items-center justify-center text-4xl cursor-pointer hover:bg-slate-800 transition"></div>`);
                </script>
            </div>
        </div>

        <!-- ГОНКА КЛИКОВ -->
        <div id="clickView" class="hidden glass p-10 w-full max-w-xl text-center">
            <h2 class="text-xl font-bold mb-8 uppercase tracking-widest text-slate-400">Битва Кнопок</h2>
            <div class="h-6 bg-slate-800 rounded-full mb-12 overflow-hidden p-1">
                <div id="raceBar" class="h-full w-1/2 bg-gradient-to-r from-blue-500 to-pink-500 rounded-full transition-all duration-75"></div>
            </div>
            <div class="flex gap-6">
                <button onmousedown="racePoint(1)" class="flex-1 h-32 bg-blue-600 rounded-3xl text-5xl font-black shadow-lg shadow-blue-500/20 active:scale-95 transition">A</button>
                <button onmousedown="racePoint(2)" class="flex-1 h-32 bg-pink-600 rounded-3xl text-5xl font-black shadow-lg shadow-pink-500/20 active:scale-95 transition">L</button>
            </div>
            <p class="mt-6 text-[10px] text-slate-500 uppercase">Жми на кнопки или клавиши 'A' и 'L'</p>
        </div>

        <!-- КОСТИ 3.0 -->
        <div id="diceView" class="hidden w-full max-w-4xl flex flex-col md:flex-row gap-6">
            <div class="glass flex-1 p-8 flex flex-col items-center justify-center text-center">
                <h2 class="text-xl font-bold mb-8 uppercase tracking-widest text-slate-400">Бросок Судьбы</h2>
                <div class="flex justify-around items-center w-full mb-12 gap-4">
                    <div class="flex flex-col items-center">
                        <div class="text-[10px] mb-4 text-blue-400 font-bold uppercase">Игрок 1</div>
                        <div class="dice-box"><div id="d1" class="dice">
                            <div class="dice-side front"><div class="dot" style="grid-area:2/2"></div></div>
                            <div class="dice-side back"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:2/2"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                            <div class="dice-side right"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                            <div class="dice-side left"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                            <div class="dice-side top"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:2/2"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                            <div class="dice-side bottom"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/2"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/2"></div><div class="dot" style="grid-area:3/3"></div></div>
                        </div></div>
                    </div>
                    <div class="text-2xl font-black text-slate-700">VS</div>
                    <div class="flex flex-col items-center">
                        <div class="text-[10px] mb-4 text-pink-400 font-bold uppercase">Игрок 2</div>
                        <div class="dice-box"><div id="d2" class="dice">
                            <div class="dice-side front"><div class="dot" style="grid-area:2/2"></div></div>
                            <div class="dice-side back"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:2/2"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                            <div class="dice-side right"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                            <div class="dice-side left"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                            <div class="dice-side top"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:2/2"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/3"></div></div>
                            <div class="dice-side bottom"><div class="dot" style="grid-area:1/1"></div><div class="dot" style="grid-area:1/2"></div><div class="dot" style="grid-area:1/3"></div><div class="dot" style="grid-area:3/1"></div><div class="dot" style="grid-area:3/2"></div><div class="dot" style="grid-area:3/3"></div></div>
                        </div></div>
                    </div>
                </div>
                <button onclick="roll()" id="diceBtn" class="w-full py-4 bg-gradient-to-r from-yellow-500 to-orange-500 text-black font-black uppercase tracking-widest rounded-2xl shadow-xl shadow-orange-500/10">Бросить</button>
            </div>
            <div class="glass w-full md:w-64 p-6">
                <h3 class="text-[10px] font-bold uppercase mb-4 text-slate-500">История</h3>
                <div id="diceHistory" class="space-y-2 max-h-[300px] overflow-y-auto custom-scrollbar pr-2 text-[10px]"></div>
            </div>
        </div>
    </div>

    <!-- ПОБЕДНОЕ ОКНО -->
    <div id="winModal" class="modal">
        <div class="glass p-10 text-center max-w-sm w-full mx-4 border-yellow-500">
            <div class="text-7xl mb-4">🏆</div>
            <h2 class="text-4xl font-black winner-text mb-2 uppercase">Молодец!</h2>
            <p id="winnerLabel" class="text-xs mb-8 text-slate-400 uppercase tracking-widest"></p>
            <button onclick="closeWinModal()" class="w-full py-4 bg-yellow-500 text-black font-bold rounded-xl uppercase">Продолжить</button>
        </div>
    </div>

    <script>
        let activeGame = '';
        let audioCtx;

        // --- AUDIO ENGINE ---
        function initAudio() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                document.getElementById('musicBtn').innerText = "Звук активен ✅";
            }
        }

        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if(type === 'click') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if(type === 'win') {
                [261, 329, 392, 523].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0, audioCtx.currentTime + i*0.1);
                    g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + i*0.1 + 0.05);
                    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + i*0.1 + 0.3);
                    o.start(audioCtx.currentTime + i*0.1); o.stop(audioCtx.currentTime + i*0.1 + 0.4);
                });
            }
        }

        function say(text) {
            const utterance = new SpeechSynthesisUtterance("Молодец! " + text);
            utterance.lang = 'ru-RU';
            window.speechSynthesis.speak(utterance);
        }

        // --- NAVIGATION ---
        function openGame(id) {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            
            document.getElementById('tttView').classList.add('hidden');
            document.getElementById('clickView').classList.add('hidden');
            document.getElementById('diceView').classList.add('hidden');
            
            activeGame = id;
            document.getElementById(id + 'View').classList.remove('hidden');
            
            if(id === 'ttt') resetTTT();
            if(id === 'click') resetRace();
            if(id === 'dice') resetDice();
        }

        function goHome() {
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('gameContainer').classList.add('hidden');
            activeGame = '';
        }

        function triggerWin(msg) {
            document.getElementById('winnerLabel').innerText = msg;
            document.getElementById('winModal').classList.add('active');
            playSound('win');
            say(msg);
        }

        function closeWinModal() {
            document.getElementById('winModal').classList.remove('active');
            openGame(activeGame);
        }

        // --- GAME 1: TIC TAC TOE ---
        let tttBoard = Array(9).fill(null), tttTurn = 'X', tttMode = 'pvp', tttActive = true;
        function setTTTMode(m) {
            tttMode = m;
            document.getElementById('tttPvp').className = m==='pvp' ? 'flex-1 text-[10px] bg-blue-600 p-2 rounded font-bold uppercase' : 'flex-1 text-[10px] bg-slate-700 p-2 rounded font-bold uppercase';
            document.getElementById('tttPve').className = m==='pve' ? 'flex-1 text-[10px] bg-blue-600 p-2 rounded font-bold uppercase' : 'flex-1 text-[10px] bg-slate-700 p-2 rounded font-bold uppercase';
            resetTTT();
        }
        function handleTTT(i) {
            if(!tttActive || tttBoard[i]) return;
            tttBoard[i] = tttTurn;
            const el = document.getElementById('ttt'+i);
            el.innerText = tttTurn;
            el.style.color = tttTurn === 'X' ? '#60a5fa' : '#f472b6';
            playSound('click');
            
            if(checkTTT()) {
                tttActive = false;
                triggerWin("Победил " + tttTurn);
                return;
            }
            if(!tttBoard.includes(null)) {
                tttActive = false;
                triggerWin("Ничья!");
                return;
            }
            
            tttTurn = tttTurn === 'X' ? 'O' : 'X';
            document.getElementById('tttStatus').innerText = "Ход " + tttTurn;
            document.getElementById('tttStatus').style.color = tttTurn === 'X' ? '#60a5fa' : '#f472b6';
            
            if(tttMode === 'pve' && tttTurn === 'O') setTimeout(tttAi, 500);
        }
        function tttAi() {
            let empty = tttBoard.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if(empty.length) handleTTT(empty[Math.floor(Math.random()*empty.length)]);
        }
        function checkTTT() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(l => tttBoard[l[0]] && tttBoard[l[0]]===tttBoard[l[1]] && tttBoard[l[0]]===tttBoard[l[2]]);
        }
        function resetTTT() {
            tttBoard.fill(null); tttTurn = 'X'; tttActive = true;
            for(let i=0; i<9; i++) document.getElementById('ttt'+i).innerText = '';
            document.getElementById('tttStatus').innerText = "Ход X";
            document.getElementById('tttStatus').style.color = '#60a5fa';
        }

        // --- GAME 2: CLICK RACE ---
        let raceScore = 50;
        function racePoint(p) {
            if(activeGame !== 'click') return;
            raceScore += (p === 1 ? 4 : -4);
            document.getElementById('raceBar').style.width = raceScore + '%';
            playSound('click');
            if(raceScore >= 100) triggerWin("Синий победил!");
            if(raceScore <= 0) triggerWin("Розовый победил!");
        }
        function resetRace() { raceScore = 50; document.getElementById('raceBar').style.width = '50%'; }
        window.onkeydown = (e) => {
            if(activeGame === 'click') {
                if(e.code === 'KeyA') racePoint(1);
                if(e.code === 'KeyL') racePoint(2);
            }
        };

        // --- GAME 3: DICE 3.0 ---
        let diceHistory = [];
        function roll() {
            const btn = document.getElementById('diceBtn');
            btn.disabled = true;
            const r1 = Math.floor(Math.random()*6)+1, r2 = Math.floor(Math.random()*6)+1;
            const rots = {1:[0,0], 2:[0,180], 3:[0,90], 4:[0,-90], 5:[-90,0], 6:[90,0]};
            const exX = (Math.floor(Math.random()*3)+3)*360, exY = (Math.floor(Math.random()*3)+3)*360;
            
            document.getElementById('d1').style.transform = `rotateX(${exX + rots[r1][0]}deg) rotateY(${exY + rots[r1][1]}deg)`;
            document.getElementById('d2').style.transform = `rotateX(${exX + rots[r2][0]}deg) rotateY(${exY + rots[r2][1]}deg)`;
            
            let i = 0;
            const sInt = setInterval(() => { playSound('click'); if(++i > 8) clearInterval(sInt); }, 150);

            setTimeout(() => {
                const winMsg = r1 > r2 ? "Игрок 1 выиграл" : (r2 > r1 ? "Игрок 2 выиграл" : "Ничья");
                diceHistory.push({r1, r2});
                updateDiceHistory();
                triggerWin(winMsg);
                btn.disabled = false;
            }, 1600);
        }
        function updateDiceHistory() {
            const hist = document.getElementById('diceHistory');
            hist.innerHTML = diceHistory.map((d, i) => `
                <div class="flex justify-between bg-white/5 p-2 rounded mb-1 border-l-2 ${d.r1 > d.r2 ? 'border-blue-500' : 'border-pink-500'}">
                    <span>Раунд ${i+1}</span>
                    <span clas

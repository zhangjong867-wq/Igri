<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-игры на двоих + Музыка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Unbounded', sans-serif;
            background: #020617;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        /* Dice Animation */
        .dice-container {
            perspective: 600px;
            width: 100px;
            height: 100px;
        }

        .dice {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        .dice-side {
            position: absolute;
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 15px;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 10px;
            box-sizing: border-box;
        }

        .dot { background: #333; border-radius: 50%; width: 15px; height: 15px; align-self: center; justify-self: center; }

        .front  { transform: rotateY(0deg) translateZ(50px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .right  { transform: rotateY(90deg) translateZ(50px); }
        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .top    { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }

        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); text-shadow: 0 0 10px #fbbf24; }
            50% { transform: scale(1.1); text-shadow: 0 0 30px #fbbf24; }
        }
        .molodec { animation: pulse-gold 1s infinite; }

        /* Background Music Control */
        #musicToggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Фоновая музыка (простой осциллятор для демонстрации, если нет ссылки на mp3) -->
    <div id="musicToggle" onclick="toggleMusic()" title="Вкл/Выкл музыку">
        <span id="musicIcon">🔇</span>
    </div>

    <!-- Меню -->
    <div id="mainMenu" class="flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-4xl md:text-6xl font-black mb-12 text-center bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">
            ИГРОВОЙ ХАБ
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-6xl">
            <div onclick="showGame('ttt')" class="glass-panel p-8 cursor-pointer hover:bg-white/5 transition border-blue-500/20">
                <div class="text-4xl mb-4">❌⭕</div>
                <h2 class="text-xl font-bold mb-2 uppercase">Крестики</h2>
                <p class="text-slate-400 text-sm">Битва против друга или ИИ.</p>
            </div>
            
            <div onclick="showGame('clicker')" class="glass-panel p-8 cursor-pointer hover:bg-white/5 transition border-pink-500/20">
                <div class="text-4xl mb-4">⚡</div>
                <h2 class="text-xl font-bold mb-2 uppercase">Гонка</h2>
                <p class="text-slate-400 text-sm">Кто быстрее нажмет кнопку 50 раз?</p>
            </div>

            <div onclick="showGame('dice')" class="glass-panel p-8 cursor-pointer hover:bg-white/5 transition border-yellow-500/20">
                <div class="text-4xl mb-4">🎲</div>
                <h2 class="text-xl font-bold mb-2 uppercase">Кубики</h2>
                <p class="text-slate-400 text-sm">У кого выпадет больше на костях?</p>
            </div>
        </div>
    </div>

    <!-- Игра 1: Крестики-Нолики -->
    <div id="tttGame" class="hidden flex-col items-center justify-center min-h-screen p-4">
        <button onclick="backToMenu()" class="mb-6 text-slate-400">← Меню</button>
        <div class="glass-panel p-6 w-full max-w-sm">
            <div class="flex justify-between mb-6">
                <button onclick="setTTTMode('pvp')" class="px-4 py-2 rounded bg-blue-600 text-[10px] font-bold uppercase">Вдвоем</button>
                <button onclick="setTTTMode('pve')" class="px-4 py-2 rounded bg-slate-700 text-[10px] font-bold uppercase">Против ИИ</button>
            </div>
            <div id="tttStatus" class="text-center mb-4 text-blue-400 uppercase text-xs">Ход X</div>
            <div class="grid grid-cols-3 gap-2 bg-slate-800 p-2 rounded-xl">
                <div data-idx="0" class="ttt-cell bg-slate-900 rounded-lg aspect-square flex items-center justify-center text-3xl cursor-pointer"></div>
                <div data-idx="1" class="ttt-cell bg-slate-900 rounded-lg aspect-square flex items-center justify-center text-3xl cursor-pointer"></div>
                <div data-idx="2" class="ttt-cell bg-slate-900 rounded-lg aspect-square flex items-center justify-center text-3xl cursor-pointer"></div>
                <div data-idx="3" class="ttt-cell bg-slate-900 rounded-lg aspect-square flex items-center justify-center text-3xl cursor-pointer"></div>
                <div data-idx="4" class="ttt-cell bg-slate-900 rounded-lg aspect-square flex items-center justify-center text-3xl cursor-pointer"></div>
                <div data-idx="5" class="ttt-cell bg-slate-900 rounded-lg aspect-square flex items-center justify-center text-3xl cursor-pointer"></div>
                <div data-idx="6" class="ttt-cell bg-slate-900 rounded-lg aspect-square flex items-center justify-center text-3xl cursor-pointer"></div>
                <div data-idx="7" class="ttt-cell bg-slate-900 rounded-lg aspect-square flex items-center justify-center text-3xl cursor-pointer"></div>
                <div data-idx="8" class="ttt-cell bg-slate-900 rounded-lg aspect-square flex items-center justify-center text-3xl cursor-pointer"></div>
            </div>
        </div>
    </div>

    <!-- Игра 2: Гонка -->
    <div id="clickerGame" class="hidden flex-col items-center justify-center min-h-screen p-4 text-center">
        <button onclick="backToMenu()" class="mb-6 text-slate-400">← Меню</button>
        <div class="glass-panel p-10 w-full max-w-xl">
            <div id="raceBar" class="h-6 bg-gradient-to-r from-blue-600 to-pink-600 w-1/2 rounded-full mb-12 transition-all"></div>
            <div class="flex gap-4">
                <button onmousedown="clickPlayer(1)" class="flex-1 h-32 rounded-2xl bg-blue-600 text-3xl font-black">A</button>
                <button onmousedown="clickPlayer(2)" class="flex-1 h-32 rounded-2xl bg-pink-600 text-3xl font-black">L</button>
            </div>
        </div>
    </div>

    <!-- Игра 3: Кости (Dice) -->
    <div id="diceGame" class="hidden flex-col items-center justify-center min-h-screen p-4 text-center">
        <button onclick="backToMenu()" class="mb-6 text-slate-400">← Меню</button>
        <div class="glass-panel p-10 w-full max-w-2xl">
            <h2 class="text-2xl font-bold mb-8 uppercase tracking-widest">Бросок Костей</h2>
            <div class="flex flex-col md:flex-row justify-around items-center gap-12 mb-12">
                <div>
                    <p class="text-blue-400 mb-4 font-bold uppercase text-xs">Игрок 1</p>
                    <div class="dice-container">
                        <div id="dice1" class="dice">
                            <!-- Стороны кубика -->
                            <div class="dice-side front"> <div class="dot" style="grid-area: 2/2"></div> </div>
                            <div class="dice-side back"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                            <div class="dice-side right"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                            <div class="dice-side left"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                            <div class="dice-side top"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                            <div class="dice-side bottom"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/2"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/2"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                        </div>
                    </div>
                    <p id="score1" class="mt-4 text-2xl font-bold">-</p>
                </div>
                
                <div class="text-4xl text-slate-600 font-black">VS</div>

                <div>
                    <p class="text-pink-400 mb-4 font-bold uppercase text-xs">Игрок 2</p>
                    <div class="dice-container">
                        <div id="dice2" class="dice">
                            <div class="dice-side front"> <div class="dot" style="grid-area: 2/2"></div> </div>
                            <div class="dice-side back"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                            <div class="dice-side right"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                            <div class="dice-side left"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                            <div class="dice-side top"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                            <div class="dice-side bottom"> <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/2"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/2"></div><div class="dot" style="grid-area: 3/3"></div> </div>
                        </div>
                    </div>
                    <p id="score2" class="mt-4 text-2xl font-bold">-</p>
                </div>
            </div>

            <button onclick="rollDices()" id="rollBtn" class="bg-yellow-500 text-black px-12 py-4 rounded-full font-black uppercase tracking-widest hover:scale-105 transition">Бросить кубики</button>
        </div>
    </div>

    <!-- Модальное окно победы -->
    <div id="winModal" class="modal">
        <div class="text-center p-8 glass-panel border-yellow-500/50 max-w-sm w-full mx-4">
            <div class="text-7xl mb-4">🏆</div>
            <h2 class="text-4xl md:text-5xl font-black text-yellow-400 molodec mb-4">МОЛОДЕЦ!</h2>
            <p id="winnerName" class="text-lg mb-8 uppercase tracking-widest">Победил Игрок</p>
            <button onclick="closeModal()" class="w-full py-4 bg-yellow-500 text-black font-bold rounded-xl uppercase">Играть еще</button>
        </div>
    </div>

    <script>
        const apiKey = "";
        let currentActiveGame = null;
        let audioCtx = null;
        let oscillator = null;
        let isMusicPlaying = false;

        // --- Музыка ---
        function toggleMusic() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (!isMusicPlaying) {
                oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'triangle'; 
                oscillator.frequency.setValueAtTime(110, audioCtx.currentTime); // Басовая линия
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                isMusicPlaying = true;
                document.getElementById('musicIcon').innerText = "🔊";
            } else {
                oscillator.stop();
                isMusicPlaying = false;
                document.getElementById('musicIcon').innerText = "🔇";
            }
        }

        // --- TTS Система ---
        async function sayWinner(name) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Say enthusiastically in Russian: Молодец! Победил ${name}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                        }
                    })
                });
                const data = await response.json();
                const pcmData = data.candidates[0].content.parts[0].inlineData.data;
                playWav(pcmData);
            } catch (err) { console.error(err); }
        }

        function playWav(base64) {
            const buffer = Uint8Array.from(atob(base64), c => c.charCodeAt(0)).buffer;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            const sampleRate = 24000;
            const writeString = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + buffer.byteLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, buffer.byteLength, true);
            const blob = new Blob([wavHeader, buffer], { type: 'audio/wav' });
            new Audio(URL.createObjectURL(blob)).play();
        }

        // --- Навигация ---
        function showGame(game) {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('tttGame').classList.add('hidden');
            document.getElementById('clickerGame').classList.add('hidden');
            document.getElementById('diceGame').classList.add('hidden');
            
            document.getElementById(game + 'Game').classList.remove('hidden');
            currentActiveGame = game;
            if(game === 'ttt') resetTTT();
            if(game === 'clicker') resetClicker();
            if(game === 'dice') resetDice();
        }

        function backToMenu() {
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('tttGame').classList.add('hidden');
            document.getElementById('clickerGame').classList.add('hidden');
            document.getElementById('diceGame').classList.add('hidden');
            currentActiveGame = null;
        }

        function closeModal() {
            document.getElementById('winModal').classList.remove('active');
            showGame(currentActiveGame);
        }

        function triggerWin(name) {
            document.getElementById('winnerName').innerText = name;
            document.getElementById('winModal').classList.add('active');
            sayWinner(name);
        }

        // --- ЛОГИКА: Кубики ---
        function rollDices() {
            const btn = document.getElementById('rollBtn');
            btn.disabled = true;
            
            const r1 = Math.floor(Math.random() * 6) + 1;
            const r2 = Math.floor(Math.random() * 6) + 1;
            
            animateDice('dice1', r1);
            animateDice('dice2', r2);

            setTimeout(() => {
                document.getElementById('score1').innerText = r1;
                document.getElementById('score2').innerText = r2;
                
                setTimeout(() => {
                    if(r1 > r2) triggerWin("Игрок 1");
                    else if(r2 > r1) triggerWin("Игрок 2");
                    else triggerWin("Ничья");
                    btn.disabled = false;
                }, 1000);
            }, 1500);
        }

        function animateDice(id, value) {
            const el = document.getElementById(id);
            const rotations = {
                1: 'rotateX(0deg) rotateY(0deg)',
                2: 'rotateY(-180deg)',
                3: 'rotateY(-90deg)',
                4: 'rotateY(90deg)',
                5: 'rotateX(-90deg)',
                6: 'rotateX(90deg)'
            };
            // Добавляем случайные полные обороты для эффекта
            const extraX = Math.floor(Math.random() * 4) * 360;
            const extraY = Math.floor(Math.random() * 4) * 360;
            el.style.transform = `rotateX(${extraX}deg) rotateY(${extraY}deg) ${rotations[value]}`;
        }

        function resetDice() {
            document.getElementById('score1').innerText = "-";
            document.getElementById('score2').innerText = "-";
            document.getElementById('dice1').style.transform = 'rotateX(0) rotateY(0)';
            document.getElementById('dice2').style.transform = 'rotateX(0) rotateY(0)';
        }

        // --- ЛОГИКА: Крестики-Нолики (упрощенная) ---
        let tttBoard = Array(9).fill(null);
        let tttTurn = 'X';
        let tttMode = 'pvp';
        const tttCells = document.querySelectorAll('.ttt-cell');

        function setTTTMode(mode) { tttMode = mode; resetTTT(); }

        tttCells.forEach(cell => {
            cell.addEventListener('click', () => {
                const idx = cell.dataset.idx;
                if (tttBoard[idx] || !tttActive) return;
                makeTTTMove(idx);
                if (tttMode === 'pve' && tttActive && tttTurn === 'O') setTimeout(aiMove, 600);
            });
        });

        let tttActive = true;
        function makeTTTMove(idx) {
            tttBoard[idx] = tttTurn;
            t
